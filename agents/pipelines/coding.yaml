# The coding identity owns this explicit, inspectable chain.  Every stage name
# is namespaced so a future domain identity cannot accidentally satisfy this
# pipeline with an unrelated generic skill.
route: coding

steps:
  - skill: coding-understanding
    gate: understanding
  - skill: coding-planning
    gate: planning
  - skill: coding-architecture
    gate: design
    condition: coding_needs_architecture
  - skill: coding-implementation
    gate: contract_alignment
  - skill: coding-validation
    gate: validation_llm

backtrack:
  coding-architecture: coding-planning
  coding-implementation: coding-planning
  coding-validation: coding-implementation
