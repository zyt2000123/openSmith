# Smith 机器配置：只声明 Smith 有什么，不描述 Smith 怎么想。
# 自然语言指令写 role/style/workflow/toolbox.md —— 写在这里不进 prompt。
#
# ⚠️ llm.*  五层 merge，本文件是第 3 层，改这里生效（model_config.py:366）
#    tools  只读 ~/.agent-smith/agent/config.yaml，改这里对已有安装不生效（preparation.py:213）

name: 个人助手
role: personal-assistant  # 遗留兼容 id = SMITH_TEMPLATE_ID，勿改
description: 面向个人工作流的常驻本地 Agent，负责理解目标、整理上下文、检索信息、规划执行并交付可落地结果

# null 不覆盖下层（yaml_utils.py:71）。可选子键：routes / models / pricing
llm:
  model: null

# 可选的领域知识语义检索。默认关闭；启用后仅在 durable 已命中领域时使用。
# knowledge:
#   embeddings:
#     enabled: true
#     base_url: https://api.openai.com/v1
#     model: text-embedding-3-small
#     api_key_env: OPENAI_API_KEY

# 严格白名单，fail-closed；再与 identity 的 tools 取交集。未列入即调不到（如 memory_ops）
tools:
  enabled:
    - read_file
    - read_pdf
    - render_pdf_page
    - write_file
    - edit_file
    - list_dir
    - glob_files
    - grep
    - shell
    - web_search
    - web_fetch
    - web_crawl
    - git_ops
    - skill_manage
    - todo
    - render_ui
